name: Release

# Builds the four launch targets (win-x64, linux-x64, linux-arm64,
# darwin-arm64 — docs/spec.md §14) on native runners, smoke-tests each
# compiled binary, and writes one SHA-256SUMS over everything.
#
# Four jobs can publish: `publish` (GitHub Release and build provenance for
# the tarballs), `publish-testpypi`, `publish-pypi` and `publish-npm`. Every
# one needs a pushed v* tag, a public repository, a repository variable the
# maintainer sets (PUBLISH_ENABLED, or PUBLISH_TEST_ENABLED for release
# candidates to TestPyPI) and its own GitHub Environment, and `publish`
# also waits for `package`, `install-smoke` and `glibc-floor`. A manual run
# (workflow_dispatch) is always a dry run: there is no input that turns
# publishing on. Nothing here triggers on pull_request or branch pushes.
# What each channel carries: GitHub Release tarballs have build provenance;
# npm packages are published with provenance; PyPI releases are
# trusted-published WITHOUT PEP 740 attestations (docs/decisions.md).
#
# After the tarballs are checksummed, `package` builds the npm tarballs
# and PyPI wheels from them (nothing is published there), `install-smoke`
# installs those packed files on all three OSes the way a user would and
# runs `context-fern init` and the binary smoke test against the result,
# and `glibc-floor` runs the Linux binary on a glibc 2.28 image, the
# floor measured from the shipped files (docs/decisions.md). Registry
# publishing is its own set of jobs (`publish-testpypi`, `publish-pypi`,
# `publish-npm`), each behind a repository variable the maintainer sets
# and a GitHub Environment they configure, so a tag alone never uploads.
#
# Structure notes, each from a real failed run (docs/decisions.md):
# - `inputs` cannot be referenced from the top-level `env:` block.
# - `matrix` is not available in a job's own `if:`/`continue-on-error:`,
#   so `targets` filtering is done by `config` emitting an already
#   filtered matrix as JSON, and linux-arm64 is its own job.
# - Every job has a timeout: an earlier version hung for four hours.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      targets:
        description: "Dry run only. Comma-separated subset of win-x64,linux-x64,linux-arm64,darwin-arm64"
        type: string
        default: "win-x64,linux-x64,linux-arm64,darwin-arm64"

# Read-only by default; only `publish` asks for more.
permissions:
  contents: read

# A newer manual run on the same ref replaces the older manual run. The
# event name is part of the group so that nothing — not even a manual
# run started on the tag itself — can cancel a tag run mid-publish; a
# re-pushed tag queues behind the run already in progress.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  BUN_VERSION: "1.4.4"

jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      run_arm64: ${{ steps.resolve.outputs.run_arm64 }}
    steps:
      - id: resolve
        env:
          # Passed through the environment, never interpolated into the
          # script text, so the input cannot inject shell.
          TARGETS_INPUT: ${{ inputs.targets }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TARGETS="$TARGETS_INPUT"
          else
            TARGETS="win-x64,linux-x64,linux-arm64,darwin-arm64"
          fi

          # runtime-dir must be exactly `${process.platform}-${process.arch}`
          # (what the patched onnxruntime-node binding looks for next to
          # the binary) — "win32-x64", not the target label "win-x64".
          FULL='[
            {"target":"win-x64","runs-on":"windows-latest","ext":".exe","runtime-dir":"win32-x64","native-dir":"win32/x64","native-files":"onnxruntime_binding.node onnxruntime.dll"},
            {"target":"linux-x64","runs-on":"ubuntu-24.04","ext":"","runtime-dir":"linux-x64","native-dir":"linux/x64","native-files":"onnxruntime_binding.node libonnxruntime.so.1"},
            {"target":"darwin-arm64","runs-on":"macos-latest","ext":"","runtime-dir":"darwin-arm64","native-dir":"darwin/arm64","native-files":"onnxruntime_binding.node libonnxruntime.1.dylib"}
          ]'
          FILTERED=$(echo "$FULL" | jq -c --arg targets "$TARGETS" '($targets | split(",")) as $wanted | [.[] | select(.target as $t | $wanted | index($t) != null)]')
          echo "matrix=$FILTERED" >> "$GITHUB_OUTPUT"

          if echo ",$TARGETS," | grep -q ",linux-arm64,"; then
            echo "run_arm64=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_arm64=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: config
    if: needs.config.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.config.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: bun install
        run: bun install --frozen-lockfile

      - name: verify dependency patches (fails, not warns, if a bump dropped one)
        run: bun test packages/embed/test/patches-verified.test.ts

      - name: compile context-fern
        run: bun build packages/cli/src/index.ts --compile --outfile dist/context-fern${{ matrix.ext }}

      - name: assemble the native sidecar
        shell: bash
        run: |
          mkdir -p "dist/onnxruntime-native/${{ matrix.runtime-dir }}"
          for f in ${{ matrix.native-files }}; do
            cp "node_modules/onnxruntime-node/bin/napi-v6/${{ matrix.native-dir }}/$f" "dist/onnxruntime-native/${{ matrix.runtime-dir }}/"
          done
          du -sh "dist/onnxruntime-native/${{ matrix.runtime-dir }}"/* dist/context-fern${{ matrix.ext }}

      - name: fetch the model and verify it against the pinned SHA-256
        timeout-minutes: 5
        run: bun run scripts/fetch-model.ts

      - name: block huggingface.co — Linux/macOS
        if: runner.os != 'Windows'
        run: |
          echo "127.0.0.1 huggingface.co" | sudo tee -a /etc/hosts
          echo "127.0.0.1 cdn-lfs.huggingface.co" | sudo tee -a /etc/hosts

      - name: block huggingface.co — Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`n127.0.0.1 huggingface.co`n127.0.0.1 cdn-lfs.huggingface.co"

      - name: smoke test (sqlite, offline embedding, daemon self-spawn, ui)
        timeout-minutes: 5
        run: bun run scripts/smoke-test.ts dist/context-fern${{ matrix.ext }}

      # Packaged here, not later: upload-artifact drops the executable
      # bit, a tarball made on the build machine keeps it.
      - name: package
        shell: bash
        run: tar czf "context-fern-${{ matrix.target }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-fern-${{ matrix.target }}
          path: context-fern-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # Its own job, not a matrix entry: see the header note on `matrix`.
  # Soft-fails only on a manual dry run; a tag run needs it to succeed.
  build-arm64:
    needs: config
    if: needs.config.outputs.run_arm64 == 'true'
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: bun install
        run: bun install --frozen-lockfile

      - name: verify dependency patches (fails, not warns, if a bump dropped one)
        run: bun test packages/embed/test/patches-verified.test.ts

      - name: compile context-fern
        run: bun build packages/cli/src/index.ts --compile --outfile dist/context-fern

      - name: assemble the native sidecar
        run: |
          mkdir -p dist/onnxruntime-native/linux-arm64
          cp node_modules/onnxruntime-node/bin/napi-v6/linux/arm64/onnxruntime_binding.node dist/onnxruntime-native/linux-arm64/
          cp node_modules/onnxruntime-node/bin/napi-v6/linux/arm64/libonnxruntime.so.1 dist/onnxruntime-native/linux-arm64/
          du -sh dist/onnxruntime-native/linux-arm64/* dist/context-fern

      - name: fetch the model and verify it against the pinned SHA-256
        timeout-minutes: 5
        run: bun run scripts/fetch-model.ts

      - name: block huggingface.co
        run: |
          echo "127.0.0.1 huggingface.co" | sudo tee -a /etc/hosts
          echo "127.0.0.1 cdn-lfs.huggingface.co" | sudo tee -a /etc/hosts

      - name: smoke test (sqlite, offline embedding, daemon self-spawn, ui)
        timeout-minutes: 5
        run: bun run scripts/smoke-test.ts dist/context-fern

      - name: package
        run: tar czf context-fern-linux-arm64.tar.gz -C dist .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-fern-linux-arm64
          path: context-fern-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3

  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun install
        run: bun install --frozen-lockfile
      - name: fetch the model and verify it against the pinned SHA-256
        timeout-minutes: 5
        run: bun run scripts/fetch-model.ts model-asset
      - name: package
        run: |
          tar czf model-xenova-all-MiniLM-L6-v2-q8.tar.gz -C model-asset .
          du -sh model-xenova-all-MiniLM-L6-v2-q8.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-fern-model
          path: model-xenova-all-MiniLM-L6-v2-q8.tar.gz
          if-no-files-found: error
          retention-days: 3

  # SHA-256SUMS is computed here, by the workflow, over the artifacts the
  # build jobs uploaded — never supplied by hand. A manual dry run may
  # checksum a partial set; a tag run needs every build to have succeeded.
  checksums:
    needs: [build, build-arm64, model]
    if: >
      !cancelled() && needs.model.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.build.result == 'success' && needs.build-arm64.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: "context-fern-*"

      - name: collect the tarballs and write SHA-256SUMS
        run: |
          mkdir -p release
          cp artifacts/*/*.tar.gz release/
          cd release
          for f in context-fern-*.tar.gz; do tar tzvf "$f"; done
          sha256sum *.tar.gz > SHA-256SUMS && cat SHA-256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 3

  # Builds the registry packages from the tarballs above. `npm pack` and a
  # stdlib-only wheel builder: nothing is published here, and a size guard
  # fails the run before PyPI's 100 MB per-file limit could.
  package:
    needs: checksums
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun install
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      # A tag must equal CLI_VERSION and the plugin manifest's version;
      # a manual run packages whatever the checked-out source says.
      - name: resolve and check the version
        id: version
        # bash with pipefail, so a failing release-version.ts fails this step even through `tee`.
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(bun -e 'import { CLI_VERSION } from "./packages/core/src/brand"; console.log(CLI_VERSION)')"
          fi
          bun scripts/release-version.ts "$tag" | tee -a "$GITHUB_OUTPUT"
          grep -q '^npm=' "$GITHUB_OUTPUT" && grep -q '^pypi=' "$GITHUB_OUTPUT"

      - name: build the npm packages
        env:
          NPM_VERSION: ${{ steps.version.outputs.npm }}
          MODEL_NPM_VERSION: ${{ steps.version.outputs.model_npm }}
        run: |
          bun scripts/pack-npm.ts \
            --version "$NPM_VERSION" \
            --model-version "$MODEL_NPM_VERSION" \
            --bundle-dir release --out packages-out/npm

      - name: build the PyPI wheels
        env:
          PYPI_VERSION: ${{ steps.version.outputs.pypi }}
          MODEL_PYPI_VERSION: ${{ steps.version.outputs.model_pypi }}
        run: |
          python3 -I packaging/pypi/build_wheels.py \
            --version "$PYPI_VERSION" \
            --model-version "$MODEL_PYPI_VERSION" \
            --bundle-dir release --out packages-out/pypi \
            --repo-url "$(bun -e 'import { REPO_URL } from "./packages/core/src/brand"; console.log(REPO_URL)')"

      - name: size guard (PyPI's default file limit is 100 MB)
        run: |
          ls -l packages-out/npm packages-out/pypi
          big="$(find packages-out -type f -size +95M)"
          if [ -n "$big" ]; then
            echo "over 95 MB, too close to PyPI's 100 MB limit:"; echo "$big"; exit 1
          fi

      # No login is needed for a dry run; it validates names, metadata and
      # file lists as a real publish would.
      # npm refuses a prerelease version without --tag, so the dry run of a
      # release candidate uses the tag the real publish will.
      - name: npm publish --dry-run for every package
        env:
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: |
          for f in packages-out/npm/*.tgz; do
            npm publish "$f" --dry-run --access public ${NPM_TAG:+--tag "$NPM_TAG"}
          done

      - name: checksums of the packages
        run: cd packages-out && sha256sum npm/* pypi/* | tee SHA-256SUMS-packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages-out/
          if-no-files-found: error
          retention-days: 3

  # Installs the packed files (from disk, offline) three ways on three
  # OSes, runs `context-fern init`, then the compiled-binary smoke test
  # against the copy init installed. These names are not required checks.
  install-smoke:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun install
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: install uv (pinned)
        run: python -m pip install uv==0.9.22

      - name: block huggingface.co — Linux/macOS
        if: runner.os != 'Windows'
        run: |
          echo "127.0.0.1 huggingface.co" | sudo tee -a /etc/hosts
          echo "127.0.0.1 cdn-lfs.huggingface.co" | sudo tee -a /etc/hosts
      - name: block huggingface.co — Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`n127.0.0.1 huggingface.co`n127.0.0.1 cdn-lfs.huggingface.co"

      - name: npm
        timeout-minutes: 8
        run: bun run scripts/install-smoke.ts --kind npm --packages packages
      - name: pip
        timeout-minutes: 8
        run: bun run scripts/install-smoke.ts --kind pip --packages packages
      - name: uvx
        timeout-minutes: 8
        run: bun run scripts/install-smoke.ts --kind uvx --packages packages

  # The Linux binary on glibc 2.28 (AlmaLinux 8), the floor measured from
  # the shipped files: the Bun binary needs 2.17, the bundled ONNX Runtime
  # library 2.28. `fern new` loads the real model through that library.
  glibc-floor:
    needs: checksums
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release
      - name: run the linux-x64 binary on glibc 2.28
        run: |
          mkdir -p lf work/proj work/home/.cache/fern/models
          tar xzf release/context-fern-linux-x64.tar.gz -C lf
          tar xzf release/model-*.tar.gz -C work/home/.cache/fern/models
          docker run --rm -v "$PWD/lf:/lf:ro" -v "$PWD/work:/work" almalinux:8 sh -ec '
            ldd --version | head -1
            export HOME=/work/home FERN_HOME=/work/home/.fern-home XDG_CACHE_HOME=/work/home/.cache
            cd /work/proj
            /lf/context-fern --version
            /lf/context-fern init --no
            /lf/context-fern new smoke
            /lf/context-fern status --json | grep -q "\"embedder\":{\"state\":\"ok\"}"
            /lf/context-fern daemon stop
            echo "glibc floor: PASS"'

  # --- Registry publishing -------------------------------------------------
  # None of these run unless the maintainer has set the repository variable
  # named in the job's `if` AND configured the matching GitHub Environment
  # (with required reviewers) and the registry's trusted publisher. The
  # exact settings are in the PR description that introduced this file.

  # A release candidate tag (vX.Y.Z-rc.N) goes to TestPyPI and to npm under
  # the `rc` dist-tag (never `latest`); PyPI proper only ever gets a stable tag.
  publish-testpypi:
    needs: [package, install-smoke, glibc-floor]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, '-rc.') &&
      github.event.repository.private == false &&
      vars.PUBLISH_TEST_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      # uv, not pypa/gh-action-pypi-publish: this repository's Actions
      # allowlist permits only GitHub-owned actions, setup-bun and setup-uv,
      # and `uv publish` does PyPI trusted publishing (OIDC) itself.
      - name: install uv (pinned)
        run: python -m pip install uv==0.9.22
      # One `uv publish` per project, each minting its own trusted-publishing
      # token: a token created from a pending publisher can create only one
      # new project, so two new projects in one command fail with "Non-user
      # identities cannot create new projects" (the rc.1 run). The model wheel
      # goes first, then the four platform wheels. --check-url skips files
      # already on the index, so a retry of a failed step uploads only what is
      # missing; a stable release's model wheel keeps its version across
      # releases, a candidate's is 1.0.0rcN.
      - name: upload the context-fern-model wheel
        run: |
          uv publish --trusted-publishing always \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/ \
            packages/pypi/context_fern_model-*.whl
      - name: upload the context-fern wheels
        run: |
          uv publish --trusted-publishing always \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/ \
            packages/pypi/context_fern-*.whl

  publish-pypi:
    needs: [package, install-smoke, glibc-floor, publish]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-rc.') &&
      github.event.repository.private == false &&
      vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: install uv (pinned)
        run: python -m pip install uv==0.9.22
      # One `uv publish` per project, each with its own token; see the
      # TestPyPI job above for why.
      - name: upload the context-fern-model wheel
        run: |
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/ \
            packages/pypi/context_fern_model-*.whl
      - name: upload the context-fern wheels
        run: |
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/ \
            packages/pypi/context_fern-*.whl

  publish-npm:
    needs: [package, install-smoke, glibc-floor, publish]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.repository.private == false &&
      vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later (docs.npmjs.com/trusted-publishers).
      - name: npm 11.5.1
        run: npm install -g npm@11.5.1
      # Dependencies first, the launcher last, so nothing resolves to a package that is not there yet.
      # A release candidate publishes under the `rc` dist-tag and a stable
      # release under `next`: no release moves `latest`. The maintainer
      # promotes a stable release with `npm dist-tag add` after verify-npm is
      # green (docs/build-plan.md). Every tarball is checked against the tag
      # BEFORE any is published, so a mismatch publishes nothing. The launcher
      # goes up only once the other five are visible on the registry, because
      # a registry that lags would otherwise hand out a launcher whose
      # platform package does not resolve yet (the rc.1 verify-npm failures).
      - name: publish
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          case "$REF_NAME" in *-rc.*) want_tag=rc ;; *) want_tag=next ;; esac
          # How long to wait for the five packages: 40 tries, 15 s apart (10 minutes).
          tries="${VISIBLE_POLL_TRIES:-40}"; pause="${VISIBLE_POLL_SECONDS:-15}"
          wait_visible() {
            i=1
            while [ "$i" -le "$tries" ]; do
              if npm view "$1" version --prefer-online >/dev/null 2>&1; then return 0; fi
              echo "waiting for $1 on the registry ($i/$tries)"
              sleep "$pause"; i=$((i + 1))
            done
            echo "$1 is still not visible on the registry after $tries tries, so the launcher was NOT published. Re-run this job; it skips what is already published."
            return 1
          }
          # An explicit order (ls would sort the launcher first), and exactly six
          # tarballs: model, win, two linux, darwin, then the launcher.
          files=()
          for pattern in packages/npm/context-fern-model-*.tgz packages/npm/context-fern-win-*.tgz packages/npm/context-fern-linux-*.tgz packages/npm/context-fern-darwin-*.tgz "packages/npm/context-fern-[0-9]*.tgz"; do
            for f in $pattern; do
              [ -e "$f" ] || { echo "no tarball matches $pattern"; exit 1; }
              files+=("$f")
            done
          done
          [ "${#files[@]}" -eq 6 ] || { echo "expected six tarballs, found ${#files[@]}: ${files[*]}"; exit 1; }
          for f in "${files[@]}"; do
            version="$(tar xzOf "$f" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')"
            case "$version" in *-rc.*) have_tag=rc ;; *) have_tag=next ;; esac
            if [ "$have_tag" != "$want_tag" ]; then
              echo "refusing to publish anything: $f is $version but the tag is $REF_NAME"
              exit 1
            fi
          done
          last=$(( ${#files[@]} - 1 ))
          for idx in "${!files[@]}"; do
            f="${files[$idx]}"
            name="$(tar xzOf "$f" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).name')"
            version="$(tar xzOf "$f" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')"
            if [ "$idx" -eq "$last" ]; then
              for g in "${files[@]:0:$last}"; do
                dep="$(tar xzOf "$g" package/package.json | node -p 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));p.name+"@"+p.version')"
                [ -n "$dep" ] || { echo "could not read the name and version of $g"; exit 1; }
                wait_visible "$dep" || exit 1
              done
            fi
            # A version already on the registry is skipped, so re-running a tag finishes a half-published release.
            if npm view "$name@$version" version --prefer-online >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            echo "publishing $name@$version under the $want_tag tag"
            npm publish "$f" --access public --provenance --tag "$want_tag"
          done

  # After publish-npm: installs from the real registry on each platform and
  # checks versions and dist-tags (scripts/verify-npm-release.ts). It reads
  # public data only, with no secrets and no id-token.
  verify-npm:
    needs: [package, publish-npm]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.repository.private == false &&
      vars.PUBLISH_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: verify the registry and a clean install
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          out="$(bun scripts/release-version.ts "$REF_NAME")"
          version="$(echo "$out" | sed -n 's/^npm=//p')"
          model_version="$(echo "$out" | sed -n 's/^model_npm=//p')"
          npm_tag="$(echo "$out" | sed -n 's/^npm_tag=//p')"
          [ -n "$version" ] && [ -n "$model_version" ] || { echo "could not read the versions for $REF_NAME"; exit 1; }
          [ "$npm_tag" = rc ] || [ "$npm_tag" = next ] || { echo "unexpected npm tag [$npm_tag] for $REF_NAME"; exit 1; }
          bun scripts/verify-npm-release.ts --version "$version" --model-version "$model_version" --tag "$npm_tag"

  # The GitHub Release and build provenance for the tarballs; the only job
  # with contents: write. Needs a push event, a v* tag, a public repository
  # and PUBLISH_ENABLED, runs in its own Environment, and waits for the
  # package, install-smoke and glibc-floor jobs, so a tag that disagrees
  # with CLI_VERSION or a package that does not install never produces a
  # Release. A release candidate tag (-rc.) is marked a prerelease.
  publish:
    needs: [checksums, package, install-smoke, glibc-floor]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.repository.private == false &&
      vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: re-verify SHA-256SUMS before anything is published
        run: cd release && sha256sum -c SHA-256SUMS

      - name: attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: "release/*.tar.gz"

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in
            *-rc.*) flags="--prerelease" ;;
          esac
          gh release create "$TAG" --title "$TAG" --generate-notes $flags \
            release/*.tar.gz release/SHA-256SUMS
