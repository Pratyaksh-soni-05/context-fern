# The branch ruleset `protect-main` requires exactly these two checks (job
# `test` with the OS matrix below):
#   test (ubuntu-latest)
#   test (windows-latest)
# Changing the job name or the matrix renames them, so it needs a ruleset
# update in the same change — otherwise a required check never reports and
# every merge to main blocks.
#
# Every action is pinned to a full 40-hex commit SHA because the repository
# requires it (Settings > Actions > General); a tag reference fails the
# whole run at startup with no check reported.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR or branch replaces the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: bun install
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: typecheck
        run: bun run typecheck

      # The product never downloads its model at runtime (spec §3.2), so
      # tests that need the real embedder get it from this one explicit,
      # checksum-verified fetch.
      - name: fetch the embedding model
        timeout-minutes: 5
        run: bun run scripts/fetch-model.ts

      - name: test
        run: bun run test

      # Chromium on the Windows runner is slow and flaky — Playwright
      # runs in this Linux job only. Component/server tests above
      # already cover both OSes. See docs/decisions.md.
      - name: build fern ui
        if: matrix.os == 'ubuntu-latest'
        run: bun run build
        working-directory: packages/ui

      - name: install Playwright Chromium
        if: matrix.os == 'ubuntu-latest'
        run: bunx playwright install --with-deps chromium
        working-directory: e2e

      - name: e2e (fern ui, Chromium)
        if: matrix.os == 'ubuntu-latest'
        run: bunx playwright test
        working-directory: e2e
