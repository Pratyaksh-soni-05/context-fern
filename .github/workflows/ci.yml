name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: bun install
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

      # Chromium on the Windows runner is slow and flaky — Playwright
      # runs in this Linux job only. Component/server tests above
      # already cover both OSes. See docs/decisions.md.
      - name: build fern ui
        if: matrix.os == 'ubuntu-latest'
        run: bun run build
        working-directory: packages/ui

      - name: install Playwright Chromium
        if: matrix.os == 'ubuntu-latest'
        run: bunx playwright install --with-deps chromium
        working-directory: e2e

      - name: e2e (fern ui, Chromium)
        if: matrix.os == 'ubuntu-latest'
        run: bunx playwright test
        working-directory: e2e
