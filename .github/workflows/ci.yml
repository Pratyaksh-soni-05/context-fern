name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: bun install
        run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test
