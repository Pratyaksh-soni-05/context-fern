<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Context Fern session card</title>

</head>
<body>
<x-dc>
<helmet>

body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 630px; box-sizing: border-box; padding: 36px; background-color: #F2EEE6; background-image: linear-gradient(#E8E2D7 1px, transparent 1px), linear-gradient(90deg, #E8E2D7 1px, transparent 1px); background-size: 80px 80px; color: #141413; font-family: 'Geist', system-ui, sans-serif; display: grid; grid-template-columns: 500px minmax(0, 1fr); gap: 40px">
<div style="position: relative; background: #E9E2D5; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px)">
<div style="position: absolute; left: 18px; top: 14px; right: 18px; display: flex; justify-content: space-between; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62"><span>your fern · grown</span><span>today</span></div>
<div style="position: absolute; left: 18px; top: 40px; right: 18px; bottom: 18px; background-image: radial-gradient(#D3CBBC 0.8px, transparent 1px); background-size: 6px 6px">
<div style="position: absolute; left: 0; top: 0; width: 12px; height: 12px; border-left: 1.5px solid #141413; border-top: 1.5px solid #141413"></div><div style="position: absolute; right: 0; top: 0; width: 12px; height: 12px; border-right: 1.5px solid #141413; border-top: 1.5px solid #141413"></div><div style="position: absolute; left: 0; bottom: 0; width: 12px; height: 12px; border-left: 1.5px solid #141413; border-bottom: 1.5px solid #141413"></div><div style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-right: 1.5px solid #141413; border-bottom: 1.5px solid #141413"></div>
<div role="img" aria-label="The session as a character fern, with four leaflets coloured by frond and one orange stray" style="position: absolute; left: 50%; top: 10px; width: 396px; height: 506px; margin-left: -198px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; line-height: 11px; white-space: pre; font-weight: 500">
<sc-for list="{{fern}}" as="L" hint-placeholder-count="6"><div style="position: absolute; inset: 0; color: {{L.color}}"><sc-for list="{{L.rows}}" as="r" hint-placeholder-count="46"><div>{{r.t}}</div></sc-for></div></sc-for>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; justify-content: space-between; padding: 6px 0">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px"><span style="width: 9px; height: 9px; border: 1.5px solid #141413; transform: rotate(45deg)"></span>shop-api · session 14 · 2h 40m<span style="flex-grow: 1; height: 6px; background-image: radial-gradient(#9A948A 1px, transparent 1.3px); background-size: 7px 6px"></span></div>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 54px; line-height: 54px; color: #9A948A">Four topics, three strays, <span style="color: #24402C; font-style: italic">nothing lost.</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 14px 16px; background: #FBFAF7; border: 1px solid #E2DBCE; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62">fronds</span><span style="display: flex; align-items: center; gap: 12px"><span style="font-family: 'Doto', ui-monospace, monospace; font-weight: 900; font-size: 46px; line-height: 44px">4</span><span style="display: flex; gap: 4px"><span style="width: 12px; height: 4px; background: #4F8A55"></span><span style="width: 12px; height: 4px; background: #3D6FB3"></span><span style="width: 12px; height: 4px; background: #7A5DC0"></span><span style="width: 12px; height: 4px; background: #B8862A"></span></span></span></div>
<div style="padding: 14px 16px; background: #FBFAF7; border: 1px solid #E2DBCE; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62">kept out, last turn</span><span style="font-family: 'Doto', ui-monospace, monospace; font-weight: 900; font-size: 46px; line-height: 44px; color: #3E7344">41K</span></div>
<div style="padding: 14px 16px; background: #FBFAF7; border: 1px solid #E2DBCE; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62">strays caught</span><span style="font-family: 'Doto', ui-monospace, monospace; font-weight: 900; font-size: 46px; line-height: 44px; color: #B8461A">3</span></div>
<div style="padding: 14px 16px; background: #FBFAF7; border: 1px solid #E2DBCE; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62">compaction losses</span><span style="font-family: 'Doto', ui-monospace, monospace; font-weight: 900; font-size: 46px; line-height: 44px">0</span></div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 10px; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #24402C"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#24402C" stroke-width="1.7" stroke-linecap="round"><path d="M12 22V3"/><path d="M12 7c2-1 4-1 6 0M12 11c-2.5-1.3-5-1.3-7.5 0M12 15c2.2-1.1 4.4-1.1 6.6 0M12 18.5c-1.6-.8-3.2-.8-4.8 0"/></svg>Context <span style="font-style: italic">Fern</span></span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62">sample · fern export --png</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":630}}'>
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function F(i, p) {
  var x = p[0], y = p[1];
  if (i === 0) return [0, 0.16 * y];
  if (i === 1) return [0.85 * x + 0.04 * y, -0.04 * x + 0.85 * y + 1.6];
  if (i === 2) return [0.2 * x - 0.26 * y, 0.23 * x + 0.22 * y + 1.6];
  return [-0.15 * x + 0.28 * y, 0.26 * x + 0.24 * y + 0.44];
}
var NB = ' ', RAMP = ' .:-+=+*#', INK = '#24402C';
var GROUPS = { '3:1': '#4F8A55', '2:2': '#3D6FB3', '3:3': '#7A5DC0', '2:4': '#B8862A', '3:0': '#E8622F' };
function charFern(o) {
  var r = rng(o.seed), p = [0, 0], side = 0, m = 0, cnt = {}, col = {}, max = 0;
  for (var i = 0; i < o.n; i++) {
    var q = r(), k = q < 0.01 ? 0 : q < 0.86 ? 1 : q < 0.93 ? 2 : 3;
    p = F(k, p);
    if (k === 1) m++; else if (k === 0) { side = 0; m = 0; } else { side = k; m = 0; }
    if (i < 20) continue;
    var x = Math.round(o.cx + (p[0] - 0.25) * o.kx), y = Math.round(o.base - p[1] * o.ky);
    if (x < 0 || x >= o.cols || y < 0 || y >= o.rows) continue;
    var key = x + ',' + y;
    cnt[key] = (cnt[key] || 0) + 1;
    if (cnt[key] > max) max = cnt[key];
    var g = GROUPS[side + ':' + m];
    if (g) col[key] = g;
  }
  var colors = {}; colors[INK] = 1;
  for (var kk in col) colors[col[kk]] = 1;
  return Object.keys(colors).map(function (c) {
    var rows = [];
    for (var y2 = 0; y2 < o.rows; y2++) {
      var s = '';
      for (var x2 = 0; x2 < o.cols; x2++) {
        var key2 = x2 + ',' + y2, v = cnt[key2] || 0;
        if (v && (col[key2] || INK) === c) s += RAMP.charAt(Math.min(RAMP.length - 1, 1 + Math.floor(Math.sqrt(v / max) * (RAMP.length - 1))));
        else s += NB;
      }
      rows.push({ t: s });
    }
    return { color: c, rows: rows };
  });
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.fern = charFern({ seed: 5, n: 80000, cols: 60, rows: 46, cx: 30, base: 45, kx: 7.4, ky: 4.4 });
  }
  renderVals() {
    return { fern: this.fern };
  }
}
</script>
</body>
</html>
