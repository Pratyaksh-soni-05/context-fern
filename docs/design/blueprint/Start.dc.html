<div style="flex-grow: 1; display: grid; grid-template-columns: 460px minmax(0, 1fr); background: #F2EEE6; color: #141413; clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px); overflow: hidden">

<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#111113" stroke-width="1.6" stroke-linecap="round"><path d="M12 22V3"/><path d="M12 7c2-1 4-1 6 0M12 11c-2.5-1.3-5-1.3-7.5 0M12 15c2.2-1.1 4.4-1.1 6.6 0M12 18.5c-1.6-.8-3.2-.8-4.8 0"/></svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 46px; line-height: 48px; color: #24402C">Open a fern</h1>
<p style="margin: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 20px; color: #5E5E66">Context Fern runs on this machine. Pick a project to see its sessions.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="Prototype.dc.html" style="min-height: 52px; box-sizing: border-box; padding: 8px 18px; border: 1px solid #D4D2CD; border-radius: 999px; background: #FFFFFF; color: #111113; text-decoration: none; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">shop-api</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6A6A72">~/code/shop-api</span></span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #3F3F46">14 sessions</span>
</a>
<a href="Prototype.dc.html" style="min-height: 52px; box-sizing: border-box; padding: 8px 18px; border: 1px solid #D4D2CD; border-radius: 999px; background: #FFFFFF; color: #111113; text-decoration: none; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">alpha-context-tree</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6A6A72">~/projects</span></span>

<div style="position: relative; background: #E9E2D5">
<svg width="100%" height="100%" viewBox="0 0 620 660" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block">
<path d="{{art.d1}}" fill="none" stroke="#24402C" stroke-width="2.6" stroke-linecap="square" opacity="0.35"></path>
<path d="{{art.d2}}" fill="none" stroke="#24402C" stroke-width="2.6" stroke-linecap="square" opacity="0.7"></path>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function F(i, p) {
  var x = p[0], y = p[1];
  if (i === 0) return [0, 0.16 * y];
  if (i === 1) return [0.85 * x + 0.04 * y, -0.04 * x + 0.85 * y + 1.6];
  if (i === 2) return [0.2 * x - 0.26 * y, 0.23 * x + 0.22 * y + 1.6];
  return [-0.15 * x + 0.28 * y, 0.26 * x + 0.24 * y + 0.44];
}
function fern(n, seed) {
  var r = rng(seed), p = [0, 0], d = ['', '', ''], seen = {};
  for (var i = 0; i < n + 20; i++) {
    var q = r(), k = q < 0.01 ? 0 : q < 0.86 ? 1 : q < 0.93 ? 2 : 3;
    p = F(k, p);
    if (i < 20) continue;
    var x = 120 + (p[0] + 2.2) * 112, y = 700 - p[1] * 78;
    var gx = Math.round(x / 6) * 6, gy = Math.round(y / 6) * 6, key = gx + ',' + gy;
    if (seen[key]) continue;
    seen[key] = 1;
    var b = r();
    d[b < 0.3 ? 0 : b < 0.7 ? 1 : 2] += 'M' + gx + ' ' + gy + 'h0.01';
  }
  return { d1: d[0], d2: d[1], d3: d[2] };
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.art = fern(16000, 21);
  }
  renderVals() {
    return { art: this.art };
  }
}
</script>
</body>
</html>
