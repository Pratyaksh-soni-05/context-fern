<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Context Fern app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
input[type=range]{accent-color:#24402C}
</style>
</helmet>
<div style="width: 1440px; height: 960px; background-color: #F2EEE6; background-image: linear-gradient(#E8E2D7 1px, transparent 1px), linear-gradient(90deg, #E8E2D7 1px, transparent 1px); background-size: 80px 80px; color: #141413; font-family: 'Geist', system-ui, sans-serif; font-size: 13px; line-height: 20px; display: flex">

<nav aria-label="App" style="width: 64px; flex-shrink: 0; border-right: 1px solid #E2DBCE; background: #F7F4EE; display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#24402C" stroke-width="1.6" stroke-linecap="round"><path d="M12 22V3"/><path d="M12 7c2-1 4-1 6 0M12 11c-2.5-1.3-5-1.3-7.5 0M12 15c2.2-1.1 4.4-1.1 6.6 0M12 18.5c-1.6-.8-3.2-.8-4.8 0"/></svg>
<div style="height: 18px"></div>
<button type="button" aria-label="Fern view" onClick="{{toFern}}" style="width: 40px; height: 40px; border: 0; border-radius: 9px; background: {{navFern}}; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#141413" stroke-width="1.4" stroke-linecap="round"><path d="M9 16V2M9 6l4-2M9 9 4.5 6.5M9 12l4.5-2.5"/></svg></button>
<button type="button" aria-label="List view" onClick="{{toList}}" style="width: 40px; height: 40px; border: 0; border-radius: 9px; background: {{navList}}; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#141413" stroke-width="1.4" stroke-linecap="round"><path d="M6 4.5h9M6 9h9M6 13.5h9M3 4.5h.01M3 9h.01M3 13.5h.01"/></svg></button>
<button type="button" aria-label="Categories view" onClick="{{toCats}}" style="width: 40px; height: 40px; border: 0; border-radius: 9px; background: {{navCats}}; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#141413" stroke-width="1.4"><rect x="2.5" y="2.5" width="5.5" height="5.5" rx="1"/><rect x="10" y="2.5" width="5.5" height="5.5" rx="1"/><rect x="2.5" y="10" width="5.5" height="5.5" rx="1"/><rect x="10" y="10" width="5.5" height="5.5" rx="1"/></svg></button>
<div style="width: 24px; height: 1px; background: #E2DBCE; margin: 8px 0"></div>
<button type="button" aria-label="Journal" style="width: 40px; height: 40px; border: 0; border-radius: 9px; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#6E6A62" stroke-width="1.4" stroke-linecap="round"><path d="M4 3h8l2 2v10H4z"/><path d="M7 8h4M7 11h4"/></svg></button>
<button type="button" aria-label="Terminal" style="width: 40px; height: 40px; border: 0; border-radius: 9px; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#6E6A62" stroke-width="1.4" stroke-linecap="round"><path d="m4 5 4 4-4 4M10 13h4"/></svg></button>
<div style="flex-grow: 1"></div>
<button type="button" aria-label="Settings" style="width: 40px; height: 40px; border: 0; border-radius: 9px; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#6E6A62" stroke-width="1.4"><circle cx="9" cy="9" r="2.2"/><path d="M9 2v2M9 14v2M2 9h2M14 9h2M4 4l1.4 1.4M12.6 12.6 14 14M4 14l1.4-1.4M12.6 5.4 14 4"/></svg></button>
</nav>

<div style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 14px">

<header style="height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 14px">
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 32px; color: #24402C">Context <span style="font-style: italic">Fern</span></span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #6E6A62">shop-api / session 14 / today</span>
</div>
<div role="tablist" aria-label="View" style="display: flex; gap: 2px; padding: 3px; border: 1px solid #DCD5C8; border-radius: 11px; background: #FBFAF7">
<sc-for list="{{views}}" as="v" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{v.on}}" onClick="{{v.pick}}" style="min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; font: 500 13px 'Geist', system-ui, sans-serif; cursor: pointer; background: {{v.bg}}; color: {{v.fg}}">{{v.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px">
<span style="display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid #B9D1B2; border-radius: 999px; background: #E3EEDD; color: #24402C"><span style="width: 7px; height: 7px; border-radius: 50%; background: #4F8A55"></span>suggest mode</span>
<span style="color: #6E6A62">localhost:7420</span>
</div>
</header>

<div style="height: 714px; display: grid; grid-template-columns: minmax(0, 1fr) 352px; gap: 14px">

<section aria-label="Context fern" style="position: relative; background: #FBFAF7; border: 1px solid #E2DBCE; display: flex; flex-direction: column; min-width: 0">
<div style="height: 46px; padding: 0 16px; border-bottom: 1px solid #E8E2D7; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; align-items: center; gap: 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px"><span style="width: 8px; height: 8px; border: 1.5px solid #141413; transform: rotate(45deg)"></span>{{panelTitle}}</span>
<div style="display: flex; gap: 8px">
<button type="button" aria-pressed="{{strayPressed}}" onClick="{{toggleStrays}}" style="min-height: 30px; padding: 0 12px; border: 1px dashed {{strayBorder}}; border-radius: 999px; background: {{strayBg}}; color: {{strayFg}}; font: 500 12px 'Geist Mono', ui-monospace, monospace; cursor: pointer">strays</button>
<button type="button" aria-pressed="{{rootPressed}}" onClick="{{toggleRoots}}" style="min-height: 30px; padding: 0 12px; border: 1px solid {{rootBorder}}; border-radius: 999px; background: {{rootBg}}; color: {{rootFg}}; font: 500 12px 'Geist Mono', ui-monospace, monospace; cursor: pointer">roots</button>
<button type="button" onClick="{{clearSel}}" style="min-height: 30px; padding: 0 12px; border: 1px solid #DCD5C8; border-radius: 999px; background: transparent; color: #6E6A62; font: 500 12px 'Geist Mono', ui-monospace, monospace; cursor: pointer">show all</button>
</div>
</div>

<div style="height: 610px; position: relative; overflow: hidden">
<sc-if value="{{isFern}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 14px; background-image: radial-gradient(#DDD6C8 0.9px, transparent 1.1px); background-size: 8px 8px"></div>
<div style="position: absolute; left: 14px; top: 14px; width: 12px; height: 12px; border-left: 1.5px solid #141413; border-top: 1.5px solid #141413"></div>
<div style="position: absolute; right: 14px; top: 14px; width: 12px; height: 12px; border-right: 1.5px solid #141413; border-top: 1.5px solid #141413"></div>
<div style="position: absolute; left: 14px; bottom: 14px; width: 12px; height: 12px; border-left: 1.5px solid #141413; border-bottom: 1.5px solid #141413"></div>
<div style="position: absolute; right: 14px; bottom: 14px; width: 12px; height: 12px; border-right: 1.5px solid #141413; border-bottom: 1.5px solid #141413"></div>
<svg width="100%" height="610" viewBox="0 0 920 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Session fern: the stem is the task, each coloured frond is a topic, leaflets are turns, dashed orange shoots are off-topic questions, roots are memories" style="position: relative; display: block">
<sc-for list="{{particles}}" as="p" hint-placeholder-count="8"><path d="{{p.d}}" fill="none" stroke="{{p.stroke}}" stroke-width="1.6" stroke-linecap="round" opacity="{{p.op}}"></path></sc-for>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="8"><path d="{{l.d}}" fill="none" stroke="{{l.stroke}}" stroke-width="{{l.w}}" stroke-dasharray="{{l.dash}}" stroke-linecap="round" opacity="{{l.op}}"></path></sc-for>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="12"><circle cx="{{n.x}}" cy="{{n.y}}" r="{{n.r}}" fill="{{n.fill}}" stroke="{{n.stroke}}" stroke-width="{{n.sw}}" opacity="{{n.op}}"></circle></sc-for>
<sc-for list="{{labels}}" as="t" hint-placeholder-count="8"><text x="{{t.x}}" y="{{t.y}}" fill="{{t.fill}}" font-family="Geist Mono, monospace" font-size="{{t.size}}" text-anchor="{{t.anchor}}" opacity="{{t.op}}">{{t.text}}</text></sc-for>
<sc-for list="{{hits}}" as="h" hint-placeholder-count="12"><circle cx="{{h.x}}" cy="{{h.y}}" r="11" fill="#000000" fill-opacity="0" onClick="{{h.pick}}" style="cursor: pointer"><title>{{h.title}}</title></circle></sc-for>
</svg>
</sc-if>

<sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
<div style="height: 610px; overflow-y: auto">
<div style="position: sticky; top: 0; background: #FBFAF7; padding: 10px 16px; border-bottom: 1px solid #E8E2D7; display: grid; grid-template-columns: 44px 160px 84px minmax(0, 1fr) 132px 48px; gap: 14px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62"><span>turn</span><span>frond</span><span>kind</span><span>prompt</span><span>context</span><span>conf</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<button type="button" onClick="{{r.pick}}" style="width: 100%; padding: 10px 16px; border: 0; border-bottom: 1px solid #EFEAE1; background: {{r.bg}}; color: #141413; text-align: left; cursor: pointer; display: grid; grid-template-columns: 44px 160px 84px minmax(0, 1fr) 132px 48px; gap: 14px; align-items: center; font: 400 13px 'Geist', system-ui, sans-serif">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; color: #6E6A62">{{r.n}}</span>
<span style="display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px"><span style="width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; background: {{r.color}}; border: 1.5px {{r.dotStyle}} {{r.ring}}"></span>{{r.frond}}</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{r.kindColor}}">{{r.kind}}</span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.prompt}}</span>
<span style="display: flex; gap: 2px" aria-label="{{r.tokLabel}}"><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="12"><span style="width: 7px; height: 7px; border-radius: 1px; background: {{c.bg}}"></span></sc-for></span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #6E6A62">{{r.conf}}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isCats}}" hint-placeholder-val="{{ false }}">
<div style="height: 610px; overflow-y: auto; box-sizing: border-box; padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-content: start">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="min-height: 168px; padding: 16px; border: 1px solid #E2DBCE; border-top: 3px {{c.topStyle}} {{c.color}}; border-radius: 2px; background: #FFFFFF; color: #141413; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; font: 400 13px 'Geist', system-ui, sans-serif">
<span style="display: flex; justify-content: space-between; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px"><span style="color: {{c.ink}}">{{c.name}}</span><span style="color: #6E6A62">{{c.count}}</span></span>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 23px; line-height: 26px; color: #24402C">{{c.headline}}</span>
<span style="color: #6E6A62; font-size: 12.5px; line-height: 19px">{{c.sub}}</span>
<span style="margin-top: auto; display: flex; gap: 2px"><sc-for list="{{c.cells}}" as="x" hint-placeholder-count="20"><span style="width: 8px; height: 8px; border-radius: 1px; background: {{x.bg}}"></span></sc-for></span>
</button>
</sc-for>
<div style="grid-column: 1 / -1; padding: 16px; border: 1px solid #E2DBCE; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
<span style="display: flex; justify-content: space-between; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: #6E6A62"><span style="color: #141413">topic switching over the session</span><span>turn 1 → {{turn}}</span></span>
<sc-for list="{{heat}}" as="h" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: center">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: {{h.ink}}">{{h.name}}</span>
<span style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px"><sc-for list="{{h.cells}}" as="x" hint-placeholder-count="20"><span style="height: 14px; border-radius: 2px; background: {{x.bg}}"></span></sc-for></span>
</div>
</sc-for>
</div>
</div>
</sc-if>
</div>

<div style="height: 56px; margin-top: auto; padding: 0 16px; border-top: 1px solid #E8E2D7; display: flex; align-items: center; gap: 14px">
<button type="button" onClick="{{play}}" style="min-height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: #141413; color: #F2EEE6; font: 500 12px 'Geist Mono', ui-monospace, monospace; cursor: pointer">{{playLabel}}</button>
<label for="fern-scrub" style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: #6E6A62">growth</label>
<input id="fern-scrub" type="range" min="1" max="20" step="1" value="{{turn}}" onChange="{{scrub}}" style="flex-grow: 1">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; width: 96px; text-align: right">turn {{turnPad}} / 20</span>
</div>
</section>

<aside aria-label="Inspector" style="background: #FBFAF7; border: 1px solid #E2DBCE; display: flex; flex-direction: column; min-height: 0">
<div style="padding: 14px 16px 8px; display: flex; align-items: center; gap: 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px"><span style="width: 8px; height: 8px; border: 1.5px solid #141413; transform: rotate(45deg)"></span>this fern<span style="flex-grow: 1; height: 6px; background-image: radial-gradient(#B5AFA4 1px, transparent 1.3px); background-size: 6px 6px"></span></div>
<div style="padding: 0 8px 10px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #E8E2D7">
<sc-for list="{{legend}}" as="g" hint-placeholder-count="7">
<button type="button" onClick="{{g.pick}}" style="min-height: 34px; padding: 0 8px; border: 0; border-radius: 7px; background: {{g.bg}}; color: #141413; display: flex; align-items: center; gap: 10px; cursor: pointer; font: 400 13px 'Geist Mono', ui-monospace, monospace; text-align: left">
<span style="width: 18px; height: 0; border-top: 2px {{g.lineStyle}} {{g.color}}; flex-shrink: 0"></span>
<span style="flex-grow: 1; font-weight: {{g.weight}}">{{g.name}}</span>
<span style="font-size: 11.5px; color: #6E6A62">{{g.count}}</span>
</button>
</sc-for>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: {{detail.ink}}">{{detail.kicker}}</span>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; line-height: 30px; color: #24402C">{{detail.title}}</span>
<sc-for list="{{detail.fields}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 3px; padding-top: 10px; border-top: 1px solid #E8E2D7">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62">{{f.k}}</span>
<span style="font-size: 13.5px; line-height: 21px">{{f.v}}</span>
</div>
</sc-for>
</div>
<div style="padding: 12px 16px; border-top: 1px solid #E8E2D7; display: flex; gap: 8px">
<button type="button" style="flex: 1; min-height: 36px; border: 1px solid #DCD5C8; border-radius: 8px; background: #FFFFFF; color: #141413; font: 500 12px 'Geist Mono', ui-monospace, monospace; cursor: pointer">open brief</button>
<button type="button" style="flex: 1; min-height: 36px; border: 0; border-radius: 8px; background: #141413; color: #F2EEE6; font: 500 12px 'Geist Mono', ui-monospace, monospace; cursor: pointer">undo routing</button>
</div>
</aside>
</div>

<div style="height: 120px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="background: #FBFAF7; border: 1px solid #E2DBCE; padding: 14px 18px; display: flex; flex-direction: column; justify-content: space-between">
<span style="display: flex; justify-content: space-between; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #6E6A62"><span style="color: #141413">{{s.k}}</span><span>{{s.note}}</span></span>
<span style="font-family: 'Doto', ui-monospace, monospace; font-weight: 900; font-size: 44px; line-height: 44px; color: {{s.color}}">{{s.v}}</span>
<span style="display: flex; gap: 3px"><sc-for list="{{s.cells}}" as="x" hint-placeholder-count="24"><span style="flex: 1; height: 3px; border-radius: 1px; background: {{x.bg}}"></span></sc-for></span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
